services:
  ai-eval-db-service:
    container_name: ai-eval-postgres
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ai-eval-db-volume:/data/postgres
    ports:
      - 5432:5432
    networks:
      - ai-eval-db-network
  ai-eval-pgadmin:
    container_name: ai-eval-pgadmin
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PG_ADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PG_ADMIN_PASSWORD}
    ports:
      - 5050:80
    volumes:
      - ai-eval-pgadmin-volume:/var/lib/pgadmin
    networks:
      - ai-eval-db-network
    depends_on:
      - ai-eval-db-service

networks:
  ai-eval-db-network:
volumes:
  ai-eval-pgadmin-volume:
  ai-eval-db-volume:
